name: Build Arch and Manjaro Packages

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-pacman:
    name: Build ${{ matrix.name }} package
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: archlinux
            name: Arch Linux
            image: archlinux:latest
          - distro: manjaro
            name: Manjaro Linux
            image: manjarolinux/base:latest
    container:
      image: ${{ matrix.image }}
      options: --privileged

    env:
      DISTRO: ${{ matrix.distro }}

    steps:
      - name: Update system and install dependencies
        run: |
          pacman -Sy --noconfirm archlinux-keyring
          if [ "$DISTRO" = manjaro ]; then
            pacman -S --noconfirm manjaro-keyring
          fi
          pacman -Syu --noconfirm --needed \
            base-devel \
            git \
            cmake \
            extra-cmake-modules \
            gcc \
            qt6-base \
            qt6-tools \
            kcoreaddons \
            okular

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure package metadata
        run: printf '%s\n' 'PACKAGER="l4rzy (github ci) <me@23ro.org>"' >> /etc/makepkg.conf

      - name: Build package
        run: |
          if ! id -u builder >/dev/null 2>&1; then
            useradd -m builder
          fi
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE/dist"
          sudo -u builder makepkg -sf --noconfirm

      - name: Label package for distribution
        run: |
          package="dist/okular-backend-pdfium-[0-9]*.pkg.tar.zst"
          shopt -s nullglob
          packages=( $package )
          test "${#packages[@]}" -eq 1
          mv "${packages[0]}" "${packages[0]%.pkg.tar.zst}.${DISTRO}.pkg.tar.zst"

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.distro }}-package
          path: dist/okular-backend-pdfium-[0-9]*.${{ matrix.distro }}.pkg.tar.zst
          if-no-files-found: error
